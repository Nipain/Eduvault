<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %} | {{ request.tenant.name }}</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }    
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold tracking-tight text-indigo-400">{{ request.tenant.name }}</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase font-semibold">School Management</p>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="/dashboard/" 
            class="flex items-center space-x-3 px-4 py-3 {% if request.path == '/admin-dashboard/' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %} rounded-xl font-medium transition">
                <span>🏠</span> <span>Overview</span>
            </a>
            
            <div class="pt-4 pb-2 text-xs font-bold text-slate-500 uppercase px-4 text-[10px] tracking-widest">Core Modules</div>
            
            <a href="{% url 'student_list' %}" 
            class="flex items-center space-x-3 px-4 py-3 {% if 'students' in request.path %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %} rounded-xl transition">
                <span>🎓</span> 
                <span>Students</span>
            </a>

            <a href="{% url 'fee_dashboard' %}" 
            class="flex items-center space-x-3 px-4 py-3 {% if 'fees' in request.path %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %} rounded-xl transition">
                <span>💰</span> <span>Fee Management</span>
            </a>

            <!-- <a href="/staff/" 
            class="flex items-center space-x-3 px-4 py-3 {% if 'staff' in request.path %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %} rounded-xl transition">
                <span>👥</span> <span>Staff Management</span>
            </a> -->
        </nav>

        <div class="p-4 border-t border-slate-800">
            <form action="/logout/" method="post">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center space-x-3 px-4 py-3 text-red-400 hover:bg-red-950/30 rounded-xl transition font-medium">
                    <span>🚪</span> <span>Logout</span>
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-10">
            <div class="text-slate-500 font-medium">
                Current School: <span class="text-indigo-600 font-bold">{{ request.tenant.name }}</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-bold text-slate-900 leading-none">{{ request.user.username }}</p>
                    <p class="text-[10px] text-slate-400 uppercase font-bold mt-1">{{ request.user.role }}</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-100 border border-indigo-200 flex items-center justify-center text-indigo-700 font-bold">
                    {{ request.user.username|slice:":1"|upper }}
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto bg-slate-50/50">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
