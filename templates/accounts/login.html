<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ request.tenant.name }} Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-lg mb-4 text-2xl font-bold">
                {{ request.tenant.name|slice:":1" }}
            </div>
            <h1 class="text-2xl font-bold text-slate-900">{{ request.tenant.name }}</h1>
            <p class="text-slate-500 text-sm mt-1">Authorized Personnel Portal</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                {% if error %}
                <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm border border-red-100 flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    {{ error }}
                </div>
                {% endif %}

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Username or Email</label>
                    <input 
                        type="text" 
                        name="username" 
                        required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all bg-slate-50/50"
                        placeholder="admin@school.com"
                    >
                </div>

                <div>
                    <div class="flex justify-between mb-1.5">
                        <label class="text-sm font-semibold text-slate-700">Password</label>
                        <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Forgot?</a>
                    </div>
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all bg-slate-50/50"
                        placeholder="••••••••"
                    >
                </div>

                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="remember" class="text-sm text-slate-500">Keep me logged in</label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 hover:-translate-y-0.5 transition-all shadow-lg active:scale-95">
                    Sign In
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-sm text-slate-400">
            Not your school? <a href="http://localhost:8000" class="text-slate-600 font-semibold hover:underline">Go back to main site</a>
        </p>
    </div>

</body>
</html>
